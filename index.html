/* ─── DATE HELPERS ─── */
const fmt = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return d + '/' + m + '/' + y;
};
const toDay = () => new Date().toISOString().split('T')[0];
function nextVisitDate(startIso, rec) {
  if (!startIso || !rec || rec === 'none') return null;
  const t = toDay();
  let cur = new Date(startIso);
  const td = new Date(t);
  while (cur < td) {
    if (rec === 'weekly') cur = new Date(cur.getTime() + 7 * 86400000);else {
      cur = new Date(cur);
      cur.setMonth(cur.getMonth() + 1);
    }
  }
  return cur.toISOString().split('T')[0];
}
function recurringDates(startIso, rec, year, month) {
  if (!startIso || !rec || rec === 'none') return [];
  const start = new Date(startIso);
  const mS = new Date(year, month, 1),
    mE = new Date(year, month + 1, 0);
  if (start > mE) return [];
  let cur = new Date(start);
  while (cur < mS) {
    if (rec === 'weekly') cur = new Date(cur.getTime() + 7 * 86400000);else {
      cur = new Date(cur);
      cur.setMonth(cur.getMonth() + 1);
    }
  }
  const out = [];
  while (cur <= mE) {
    if (cur >= mS) out.push(cur.toISOString().split('T')[0]);
    if (rec === 'weekly') cur = new Date(cur.getTime() + 7 * 86400000);else {
      cur = new Date(cur);
      cur.setMonth(cur.getMonth() + 1);
    }
  }
  return out;
}
function eventsForMonth(props, year, month) {
  const map = {};
  const add = (date, ev) => {
    if (!map[date]) map[date] = [];
    map[date].push(ev);
  };
  props.forEach(p => {
    recurringDates(p.visitStartDate || null, p.visitRecurrence || null, year, month).forEach(d => add(d, {
      propId: p.id,
      propName: p.name,
      type: 'visit',
      note: '',
      evId: null
    }));
    (p.manualEvents || []).forEach(ev => {
      const [y, m2] = ev.date.split('-').map(Number);
      if (y === year && m2 - 1 === month) add(ev.date, {
        propId: p.id,
        propName: p.name,
        type: 'manual',
        note: ev.note || '',
        evId: ev.id
      });
    });
  });
  return map;
}
function hasOverdue(props) {
  const t = toDay();
  for (let back = 0; back <= 6; back++) {
    const d = new Date();
    d.setMonth(d.getMonth() - back);
    const evs = eventsForMonth(props.filter(p => !p.archived), d.getFullYear(), d.getMonth());
    for (const date of Object.keys(evs)) if (date < t) return true;
  }
  return false;
}

/* planned actions helpers – backward compat with old string format */
const normP = a => typeof a === 'string' ? {
  text: a,
  urgent: false,
  rdv: false,
  rdvDate: ''
} : {
  text: '',
  urgent: false,
  rdv: false,
  rdvDate: '',
  ...a
};
const planAll = items => (items || []).map(normP);
const planFull = items => (items || []).map(normP).filter(a => a.text.trim());
function propertyBadge(p) {
  const t = toDay();
  const nxt = nextVisitDate(p.visitStartDate || null, p.visitRecurrence || null);
  const todayManual = (p.manualEvents || []).some(e => e.date === t);
  const overdueOrToday = nxt && nxt <= t || todayManual;
  const last = (p.reports || []).slice(-1)[0];
  const urgAct = last && planFull(last.actionsPlanned).some(a => a.urgent && !(a.rdv && a.rdvDate));
  const rdvAct = last && planFull(last.actionsPlanned).some(a => a.urgent && a.rdv && a.rdvDate);
  const anyAct = last && planFull(last.actionsPlanned).length > 0;
  const days = nxt ? Math.ceil((new Date(nxt) - new Date(t)) / 86400000) : null;
  if (overdueOrToday || urgAct) return 'urgent';
  if (anyAct || days !== null && days <= 2 || rdvAct) return 'warn';
  return 'ok';
}

/* extract all notable observations from a saved report */
function reportObs(report, t) {
  const list = [];
  (report.exterior || []).forEach((item, i) => {
    if (item.status || item.note) {
      const label = !item.custom && i < t.ext.items.length ? t.ext.items[i] : item.label || 'Ext.' + (i + 1);
      list.push({
        source: t.ext.title,
        loc: label,
        desc: item.note || '',
        status: item.status,
        photos: item.photos || []
      });
    }
  });
  (report.rooms || []).forEach(r => {
    if (r.status || r.note) list.push({
      source: t.int.title,
      loc: r.name,
      desc: r.note || '',
      status: r.status,
      photos: r.photos || []
    });
  });
  (report.technique || []).forEach((item, i) => {
    if (item.status || item.note) list.push({
      source: t.tec.title,
      loc: t.tec.items[i] || '',
      desc: item.note || '',
      status: item.status,
      photos: item.photos || []
    });
  });
  (report.observations || []).forEach(o => {
    list.push({
      source: ['Info', 'Surveiller', 'Urgent'][o.prio] || '',
      loc: o.loc || '',
      desc: o.desc || '',
      status: o.prio === 2 ? 'urgent' : o.prio === 1 ? 'warn' : null,
      photos: o.photos || []
    });
  });
  return list;
}
